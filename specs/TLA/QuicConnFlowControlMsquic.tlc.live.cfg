\* Liveness model for QuicConnFlowControlMsquic (msquic main,
\* receive-pause with lowered-MAX_DATA accounting, clamped ApplyMaxData).
\* SPECIFICATION FairSpec = delivering-network assumption: no MAX_DATA loss
\* (LoseCtrl excluded from FairNext) + weak fairness on every MAX_DATA
\* delivery (ApplyMaxData per frame value). Fairness is NOT placed on
\* environment actions.
\* PROPERTY Live: (Live1) Resumed ~> (PeerMaxData = RecvLimit) and
\* (Live2) (Resumed /\ ~Pause) ~> (NotFcBlocked \/ Pause) -- after R
\* releases the pause and the network delivers the frame, S can send
\* again.
\* Same bounds as the safety model; no CONSTRAINT/SYMMETRY/VIEW (forbidden
\* together with PROPERTY).
CONSTANTS
  RecvLimitMaxValue = 3
  MaxPortions = 2

SPECIFICATION FairSpec

PROPERTY Live

INVARIANT TypeOK
INVARIANT NoFlowControlError
INVARIANT ReceivedWithinLimit
INVARIANT NoWraparound
INVARIANT PeerMaxDataSanity
INVARIANT SenderWithinAdvertisedLimit
INVARIANT DataNotLostOrOverAccepted
