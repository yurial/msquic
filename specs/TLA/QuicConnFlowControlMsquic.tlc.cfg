\* Safety model for QuicConnFlowControlMsquic (msquic main, receive-pause
\* with lowered-MAX_DATA accounting, clamped ApplyMaxData).
\* Bounds (documented modeling assumptions, see the module header):
\*   RecvLimitMaxValue = 3 : the original receive window (constant here);
\*   MaxPortions = 2       : STREAM portions of 1..2 bytes.
\* The model is closed and finite; no CONSTRAINT/SYMMETRY/VIEW is used.
CONSTANTS
  RecvLimitMaxValue = 3
  MaxPortions = 2

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT NoFlowControlError
INVARIANT ReceivedWithinLimit
INVARIANT NoWraparound
INVARIANT PeerMaxDataSanity
INVARIANT SenderWithinAdvertisedLimit
INVARIANT DataNotLostOrOverAccepted
